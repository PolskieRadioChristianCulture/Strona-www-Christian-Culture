          border-radius: 50%;

          transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                      visibility 0.3s cubic-bezier(0.16, 1, 0.3, 1),

          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(212, 169, 74, 0.15);
          backdrop-filter: blur(5px);
          -webkit-backdrop-filter: blur(5px);
          outline: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
      }
      .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
      .back-to-top:hover { background: #D4A94A; color: #050505; box-shadow: 0 8px 25px rgba(212, 169, 74, 0.4); transform: translateY(-3px); }
      .back-to-top:active { transform: translateY(0) scale(0.95); }

    <script>
      setTimeout(function () {
        var message = document.getElementById('edukacja-startup-message');
        if (message) message.textContent = 'Nie udało się załadować portalu. Odśwież stronę. W razie pytań napisz: redakcjaccn@gmail.com.';
      }, 15000);

      (function() {
        var backToTopBtn = document.getElementById('backToTopBtn');
        if (!backToTopBtn) return;
        function updateScroll() {
          if (window.scrollY > 300) { backToTopBtn.classList.add('visible'); }
          else { backToTopBtn.classList.remove('visible'); }
        }
        window.addEventListener('scroll', updateScroll, { passive: true });
        backToTopBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        updateScroll();
      })();
    </script>
