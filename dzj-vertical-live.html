<script>
document.addEventListener("DOMContentLoaded", () => {

    // ── VIEWPORT SCALING ──
    function resizeViewport() {
        const c = document.getElementById("app-container");
        const targetW = 1080, targetH = 1920;
        const scale = Math.min(window.innerWidth / targetW, window.innerHeight / targetH);
        c.style.transform = `scale(${scale})`;
        c.style.left = `${(window.innerWidth - targetW * scale) / 2}px`;
        c.style.top  = `${(window.innerHeight - targetH * scale) / 2}px`;
    }
    window.addEventListener("resize", resizeViewport);
    resizeViewport();

    // ── CLOCK ──
    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clockDisplay").textContent = `${hh}:${mm}`;

        const days = ["Niedziela","Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota"];
        const months = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
        document.getElementById("dateDisplay").textContent =
            `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    // ── CYCLE BADGE (updates by day of week) ──
    const dayOfWeek = new Date().getDay();
    const themes = ["Niedziela z Bogiem","Poranny Impuls","Dobry Wtorek","Środa Słowa","Czwartek Misji","Piątek Chwały","Sobotni Spokój"];
    document.getElementById("cycleBadge").innerHTML = `✝️ Dobrze, że jesteś &nbsp;·&nbsp; ${themes[dayOfWeek]}`;

    // ── SCHEDULE ──
    const schedulePrograms = {
        morning: [
            { time: "06:00", label: "Rozważanie Dnia" },
            { time: "08:00", label: "Telewizja Christian Culture 24" },
            { time: "10:00", label: "Radio Biblia Audio" }
        ],
        afternoon: [
            { time: "12:00", label: "Modlitwa Południa" },
            { time: "14:00", label: "Słowo na Popołudnie" },
            { time: "16:00", label: "Telewizja Christian Culture 24" }
        ],
        evening: [
            { time: "18:00", label: "Wieczorne Rozważanie" },
            { time: "20:00", label: "Modlitwa Wieczorna" },
            { time: "22:00", label: "Słowo na Noc" }
        ],
        night: [
            { time: "22:30", label: "Słowo na Noc" },
            { time: "00:00", label: "Nocne Czuwanie" },
            { time: "01:30", label: "Walka Duchowa" }
        ]
    };

    function buildSchedule() {
        const hour = new Date().getHours();
        let prog;
        if (hour >= 6  && hour < 12) prog = schedulePrograms.morning;
        else if (hour >= 12 && hour < 18) prog = schedulePrograms.afternoon;
        else if (hour >= 18 && hour < 22) prog = schedulePrograms.evening;
        else prog = schedulePrograms.night;

        const container = document.getElementById("scheduleRows");
        // 🛡️ STRAŻNIK: wyróżniamy program, który trwa TERAZ (wcześniej zawsze pierwszy wiersz)
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
        let activeIdx = 0;
        // Noc przechodzi przez północ: po 22:00 liczą się tylko pozycje wieczorne, przed 6:00 — poranne godziny nocy.
        prog.forEach((p, i) => {
            const m = toMin(p.time);
            const sameSide = hour >= 22 ? m >= 12 * 60 : (hour < 6 ? m < 12 * 60 : true);
            if (sameSide && m <= nowMin) activeIdx = i;
        });
        container.innerHTML = prog.map((p, i) => {
            const isActive = i === activeIdx;
            return `<div class="schedule-row${isActive ? " active" : ""}">
                <span class="schedule-time">${p.time}</span>
                <span class="schedule-program">${p.label}</span>
            </div>`;
        }).join("");
    }
    buildSchedule();
    setInterval(buildSchedule, 60000);

    // ── WEATHER ──
    const cityCoords = {
        "WARSZAWA":       { lat: 52.23, lon: 21.01 },
        "KRAKÓW":         { lat: 50.06, lon: 19.94 },
        "GDAŃSK":         { lat: 54.35, lon: 18.65 },
        "WROCŁAW":        { lat: 51.11, lon: 17.04 },
        "RZESZÓW":        { lat: 50.04, lon: 22.00 },
        "STALOWA WOLA":   { lat: 50.58, lon: 22.05 }
    };

    let realWeatherData = {};

    function weatherIcon(code, isDay) {
        if (code === 0)  return isDay ? "☀️" : "🌙";
        if (code <= 2)   return "🌤️";
        if (code === 3)  return "☁️";
        if (code <= 48)  return "🌫️";
        if (code <= 65)  return "🌧️";
        if (code <= 77)  return "❄️";
        if (code <= 82)  return "🌦️";
        return "⛈️";
    }

    function renderWeather() {
        const strip = document.getElementById("weatherStrip");
        if (!Object.keys(realWeatherData).length) return;
        strip.innerHTML = Object.entries(realWeatherData).map(([city, data]) =>
            `<div class="weather-chip">
                <div class="weather-city">${city}</div>
                <div class="weather-data">${data}</div>
            </div>`
        ).join("");
    }

    async function fetchWeather() {
        // 🛡️ STRAŻNIK: jedno zapytanie dla wszystkich miast (Open-Meteo), tylko prawdziwe dane
        try {
            const entries = Object.entries(cityCoords);
            const lat = entries.map(([, c]) => c.lat).join(",");
            const lon = entries.map(([, c]) => c.lon).join(",");
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,is_day,weather_code&timezone=Europe%2FWarsaw`);
            if (!res.ok) throw new Error("HTTP " + res.status);
            let data = await res.json();
            if (!Array.isArray(data)) data = [data];
            data.forEach((d, i) => {
                const city = entries[i] && entries[i][0];
                if (!city || !d || !d.current) return;
                realWeatherData[city] = `${weatherIcon(d.current.weather_code, d.current.is_day)} ${Math.round(d.current.temperature_2m)}°C`;
            });
        } catch (e) { console.warn("Weather error:", e && e.message); }
        renderWeather();
    }
    fetchWeather();
    setInterval(fetchWeather, 900000); // every 15 min

    // ── NEWS TICKER ──
    async function loadTicker() {
        try {
            const res = await fetch("news.json?t=" + Date.now());
            const headlines = await res.json();
            const rds = window.mcSpecialRdsMessage || "";
            if ((headlines && headlines.length) || rds) {
                const joined = rds + (headlines || []).map(h => `<span class="ticker-bullet">◆</span>${h}`).join("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;");
                const html = `<span class="ticker-text">${joined}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
                document.getElementById("tickerText1").innerHTML = joined;
                document.getElementById("tickerText2").innerHTML = joined;
            }
        } catch(e) { console.warn("Ticker error:", e); }
    }
    window.loadNewsMarquee = loadTicker; // komunikaty Mission Control (js/cc-live-mission-feed.js)
    loadTicker();
    setInterval(loadTicker, 600000); // every 10 min

    // ── REFLECTION (from rozwazania_baza.json) ──
    const todayStr = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
    if (localStorage.getItem("dzj_v916_date") !== todayStr) {
        localStorage.removeItem("dzj_v916_day");
        localStorage.setItem("dzj_v916_date", todayStr);
    }

    fetch("rozwazania_baza.json?t=" + Date.now())
        .then(r => r.json())
        .then(data => {
            let idx = 0;
            const savedDay = localStorage.getItem("dzj_v916_day");
            if (savedDay !== null) {
                idx = parseInt(savedDay, 10);
            } else {
                const found = data.findIndex(r => r.date === todayStr);
                if (found !== -1) idx = found;
            }

            const ref = data[idx] || data[0];
            if (!ref) return;

            const dayNum = ref.day || (idx + 1);
            document.getElementById("reflectionDay").textContent =
                `Dzień ${dayNum} · ${ref.dayOfWeek || ""}`;
            document.getElementById("reflectionTitle").textContent = ref.title || "Słowo na Dziś";
            document.getElementById("reflectionTeaser").textContent = ref.teaser || ref.theme || "";

            // Midnight auto-advance
            setInterval(() => {
                const now = new Date();
                if (now.getHours() === 0 && now.getMinutes() === 0) {
                    let nextIdx = (idx + 1) % data.length;
                    localStorage.setItem("dzj_v916_day", nextIdx);
                    location.reload();
                }
            }, 60000);
        })
        .catch(e => {
            console.warn("Reflection load error:", e);
            document.getElementById("reflectionTitle").textContent = "Słowo na Dziś";
            document.getElementById("reflectionTeaser").textContent = "Dobrze, że jesteś — Radio Christian Culture nadaje 24/7.";
        });

    // ── AUDIO ──
    const audio = document.getElementById("stream-audio");
    if (audio) {
        setTimeout(() => {
            audio.play().catch(e => console.warn("Audio autoplay blocked:", e));
        }, 1200);
        setInterval(() => {
            if (audio.paused) audio.play().catch(() => {});
        }, 10000);

        // 🛡️ STRAŻNIK EMISJI (2026-10-08): strumień, który „gra”, ale nie dostaje danych (zerwane
        // połączenie), albo zgłosi błąd — łączymy ponownie, zamiast nadawać ciszę.
        const STREAM_URL = audio.getAttribute("src");
        let lastT = -1, lastProgress = Date.now(), reconnecting = false;
        window.ccBroadcastLog = window.ccBroadcastLog || [];
        function reconnect(reason) {
            if (reconnecting) return;
            reconnecting = true;
            window.ccBroadcastLog.push(new Date().toISOString() + " audio: " + reason);
            if (window.ccBroadcastLog.length > 50) window.ccBroadcastLog.shift();
            audio.src = STREAM_URL + (STREAM_URL.includes("?") ? "&" : "?") + "r=" + Date.now();
            audio.load();
            audio.play().catch(() => {}).finally(() => { lastProgress = Date.now(); reconnecting = false; });
        }
        audio.addEventListener("timeupdate", () => { if (audio.currentTime !== lastT) { lastT = audio.currentTime; lastProgress = Date.now(); } });
        audio.addEventListener("error", () => setTimeout(() => reconnect("błąd strumienia"), 3000));
        audio.addEventListener("ended", () => setTimeout(() => reconnect("strumień zakończony"), 1000));
        setInterval(() => {
            if (!audio.paused && Date.now() - lastProgress > 20000) reconnect("brak danych > 20 s");
        }, 5000);
    }

    // ── GREETING OVERLAY (activated via URL param ?greet=TEXT) ──
    const params = new URLSearchParams(window.location.search);
    const greetText = params.get("greet");
    if (greetText) {
        const overlay = document.getElementById("greetingOverlay");
        document.getElementById("greetingText").textContent = decodeURIComponent(greetText);
        overlay.classList.add("visible");
        setTimeout(() => overlay.classList.remove("visible"), 8000);
    }

});
</script>
