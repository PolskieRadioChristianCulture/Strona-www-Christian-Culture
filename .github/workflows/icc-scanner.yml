name: ICC Scanner (scheduled)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Guardian (non-fatal)
        id: guardian
        run: |
          if [ -f scripts/straznik-kodu-check.js ]; then
            node scripts/straznik-kodu-check.js > guardian.out 2>&1 || true
          else
            echo "no_guardian" > guardian.out
          fi
          head -c 3000 guardian.out > guardian.trim || true

      - name: Run ICC scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/icc_scan.js
