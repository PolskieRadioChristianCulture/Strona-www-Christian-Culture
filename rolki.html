        /* Vertically Scrollable Reel Slides Container */

        .shorts-loading-state,

        .short-slide {

            height: 100%;
            scroll-snap-align: start;

            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            contain: layout paint;
        }

        /* Media Container */
        .video-container {
            position: absolute;

            height: 100%;
            border: none;
            pointer-events: auto;

                /* Oryginalne 9:16 — czyste, autentyczne dopasowanie bez czarnych pasów i zniekształceń */
        .video-container iframe.youtube-shorts-iframe {
            position: absolute;
            top: -46px;
            left: 0;
            width: 100%;
            height: calc(100% + 50px);
            min-width: 100%;
            min-height: 100%;
            max-width: none;
            border: none;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .youtube-short-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #080808;
            transition: opacity 180ms ease;
        }

        .short-slide.media-ready .video-container iframe.youtube-shorts-iframe {
            opacity: 1;
        }

        .short-slide.media-ready .youtube-short-poster {
            opacity: 0;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)

        function showShortsToast(msg) {
            const toast = document.getElementById('shortsToast');
            if (!toast) return;

            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        // ── Global Mute / Unmute ──
        window.toggleGlobalMute = function() {
            isGlobalMuted = !isGlobalMuted;

            if (icon) {
                icon.className = isGlobalMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                icon.style.color = isGlobalMuted ? '#fff' : '#facc15';
            }

            // Apply to all HTML5 video elements
            document.querySelectorAll('.short-slide video').forEach(v => {
                v.muted = isGlobalMuted;
            });

            showShortsToast(isGlobalMuted ? '🔇 Wyciszono dźwięk' : '🔊 Dźwięk włączony');

        window.toggleAmen = function(shortId, btnEl, labelId) {
            const isLiked = localStorage.getItem('lumina_amen_' + shortId) === '1';
            const labelEl = document.getElementById(labelId);
            let count = parseInt(labelEl.getAttribute('data-count') || '0', 10);

            if (!isLiked) {
                localStorage.setItem('lumina_amen_' + shortId, '1');
                count += 1;
                btnEl.classList.add('amen-active');
                showShortsToast('🕊️ Amen! Chwała Bogu!');
            } else {
                localStorage.removeItem('lumina_amen_' + shortId);
                count = Math.max(0, count - 1);
                btnEl.classList.remove('amen-active');
            }

            labelEl.setAttribute('data-count', count);
            labelEl.textContent = count;
        };

        // ── Smart Multi-Platform URL Parser ──
        function parseReelUrl(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') return null;
            const url = rawUrl.trim();

            // 1. YouTube Shorts / Videos (Obsługuje wszystkie formaty linków)
            const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=|shorts\/)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const ytMatch = url.match(ytRegex);
            if (ytMatch && ytMatch[1]) {
                const vidId = ytMatch[1];
                return {
                    platform: 'youtube',
                    id: vidId,
                    label: 'YouTube Shorts',
                    icon: 'fa-brands fa-youtube',
                    color: '#ef4444',
                    badgeClass: 'yt',
                    embedSrc: vidId,
                    previewUrl: `https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&playsinline=1`
                };
            }

            // 2. Google Drive Video
            const gdriveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
            if (gdriveMatch && gdriveMatch[1]) {
                const fileId = gdriveMatch[1];
                return {
                    platform: 'gdrive',
                    id: fileId,
                    label: 'Dysk Google • Wideo',
                    icon: 'fa-brands fa-google-drive',
                    color: '#34a853',
                    badgeClass: 'gdrive',
                    embedSrc: fileId,
                    previewUrl: `https://drive.google.com/file/d/${fileId}/preview`
                };
            }

            // 3. TikTok
            const tiktokIdMatch = url.match(/tiktok\.com\/(?:@[^\/]+\/video\/|v\/|t\/)?(\d+)/i) || url.match(/\/(\d{15,22})/);
            if (url.includes('tiktok.com') || tiktokIdMatch) {
                const id = tiktokIdMatch ? tiktokIdMatch[1] : url;
                return {
                    platform: 'tiktok',
                    id: id,
                    label: 'TikTok Reel',
                    icon: 'fa-brands fa-tiktok',
                    color: '#00f2fe',
                    badgeClass: 'tiktok',
                    embedSrc: id,
                    previewUrl: `https://www.tiktok.com/embed/v2/${id}`
                };
            }

            // 4. Instagram Reels
            const igMatch = url.match(/instagram\.com\/(?:reel|reels|p)\/([a-zA-Z0-9_-]+)/i);
            if (igMatch && igMatch[1]) {
                const id = igMatch[1];
                return {
                    platform: 'instagram',
                    id: id,
                    label: 'Instagram Reel',
                    icon: 'fa-brands fa-instagram',
                    color: '#ec4899',
                    badgeClass: 'instagram',
                    embedSrc: id,
                    previewUrl: `https://www.instagram.com/reel/${id}/embed/`
                };
            }

            // 5. Facebook Reels
            if (url.includes('facebook.com') || url.includes('fb.watch')) {
                const fbReelMatch = url.match(/facebook\.com\/reel\/(\d+)/i) || url.match(/fb\.watch\/([a-zA-Z0-9_-]+)/i);
                const fbId = fbReelMatch ? fbReelMatch[1] : '';
                return {
                    platform: 'facebook',
                    id: fbId || url,
                    label: 'Facebook Reel',
                    icon: 'fa-brands fa-facebook',
                    color: '#1877f2',
                    badgeClass: 'facebook',
                    embedSrc: url,
                    previewUrl: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&autoplay=true&t=0`
                };
            }

            // 6. MP4 / WebM / Direct Video
            if (url.match(/\.(mp4|webm|mov)(\?.*)?$/i) || url.includes('storage.googleapis.com') || url.includes('.m3u8')) {
                return {
                    platform: 'mp4',
                    id: 'mp4_' + Date.now(),
                    label: 'Wideo MP4',
                    icon: 'fa-solid fa-file-video',
                    color: '#facc15',
                    badgeClass: 'mp4',
                    embedSrc: url,
                    previewUrl: url
                };
            }

            // Fallback for valid HTTP URL
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return {
                    platform: 'mp4',
                    id: 'url_' + Date.now(),
                    label: 'Wideo Online',
                    icon: 'fa-solid fa-video',
                    color: '#38bdf8',
                    badgeClass: 'mp4',
                    embedSrc: url,
                    previewUrl: url
                };
            }

            return null;
        }

        // ── Real-Time URL Input Handler ──
        window.handleReelUrlInput = function(val) {
            const badgeContainer = document.getElementById('detectedPlatformBadge');
            const previewContainer = document.getElementById('reelPreviewContainer');
            const previewFrame = document.getElementById('reelPreviewFrame');
            if (!badgeContainer) return;

            const parsed = parseReelUrl(val);

                badgeContainer.innerHTML = '<span class="detected-badge-empty">Wklej link, a system automatycznie rozpozna platformę</span>';
                if (previewContainer) previewContainer.style.display = 'none';

            badgeContainer.innerHTML = `
                <span class="detected-badge-active" style="background:${parsed.color}22; color:${parsed.color}; border:1px solid ${parsed.color}66;">
                    <i class="${parsed.icon}"></i> Wykryto: ${parsed.label}
                </span>
            `;

            if (previewContainer && previewFrame) {
                previewContainer.style.display = 'block';
                if (parsed.platform === 'mp4') {
                    previewFrame.innerHTML = `<video src="${parsed.previewUrl}" autoplay muted loop playsinline></video>`;
                } else {
                    previewFrame.innerHTML = `<iframe src="${parsed.previewUrl}" title="Podgląd" allow="autoplay" allowfullscreen></iframe>`;
                }
            }
        };

        // ── Inteligentny Algorytm Dynamicznego Tasowania (Fisher-Yates) ──
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function smartFeedShuffle(items, pinnedId = null) {
            if (!items || items.length <= 1) return items;

            let pinned = null;
            let pool = [];

            if (pinnedId) {
                pinned = items.find(it => it.id === pinnedId);
                pool = items.filter(it => it.id !== pinnedId);
            } else {
                pool = [...items];
            }

            // Losujemy kolejność, aby za każdym razem sekwencja była świeża i nieprzewidywalna
            pool = shuffleArray(pool);

            // Heurystyka anty-klastrowa: rozsuwamy kanały live, aby nie były pod rząd
            for (let i = 0; i < pool.length - 1; i++) {
                const isCurLive = pool[i].videoType === 'live_iframe';
                const isNextLive = pool[i + 1].videoType === 'live_iframe';
                if (isCurLive && isNextLive) {
                    const swapIdx = pool.findIndex((it, idx) => idx > i + 1 && it.videoType !== 'live_iframe');
                    if (swapIdx !== -1) {
                        [pool[i + 1], pool[swapIdx]] = [pool[swapIdx], pool[i + 1]];
                    }
                }
            }

            return pinned ? [pinned, ...pool] : pool;
        }

        // ── Render Slides (Inicjalizacja z dynamicznym losowaniem) ──

            const container = document.getElementById('shortsContainer');

            // Filtracja: wyłącznie działające, zweryfikowane materiały
            const base = (items || []).filter(isPlayableShort);

            if (!poolToUse.length) {
                container.setAttribute('aria-busy', 'false');
                container.innerHTML = `
                    <div class="shorts-empty-state" role="status">
                        <i class="fa-solid fa-film" aria-hidden="true"></i>

            // Sprawdzenie czy wywołano bezpośrednią rolkę przez hash w URL

            // Dynamiczne inteligentne tasowanie (brak stałej, przewidywalnej sekwencji!)
            cleanShortsBase = smartFeedShuffle(poolToUse, targetHash);

            cleanShortsBase.forEach((item, index) => {
                const slide = createSlideElement(item, index);
                if (index === 0) {
                    slide.classList.add('active');
                    activeSlideIndex = 0;

                container.appendChild(slide);

            setupIntersectionObserver();
            setupInfiniteScroll();
            updateAutoAdvanceUI();
            if (typeof window.resetCaptionsAutoHideOnSlideChange === 'function') {

            setTimeout(() => {
                const firstSlide = container.querySelector('.short-slide');
                if (firstSlide && window.AudioDirector) {
                    const vid = firstSlide.querySelector('video');
                    const ifr = firstSlide.querySelector('iframe');
                    const media = vid || ifr;
                    const type = vid ? 'video' : (ifr && ifr.classList.contains('live-channel-iframe') ? 'live_iframe' : 'youtube');
                    window.AudioDirector.acquireFocus(firstSlide.id, type, media);
                }

        // ── Pętla Nieskończonego Przewijania (Każda nowa pętla jest świeżo tasowana) ──
        function appendInfiniteShortsLoop() {
            if (isLoopAppending || !cleanShortsBase.length) return;
            isLoopAppending = true;
            loopCounter++;

            const container = document.getElementById('shortsContainer');
            if (!container) { isLoopAppending = false; return; }

            const startIndex = container.querySelectorAll('.short-slide').length;

            // ŚWIEŻE LOSOWANIE dla kolejnej paczki rolek — koniec ze stałą sekwencją!
            let nextBatch = shuffleArray(cleanShortsBase);

            // Zabezpieczenie: pierwszy element nowej paczki nie może być taki sam jak ostatni
            const currentLastSlide = container.querySelector('.short-slide:last-child');
            if (currentLastSlide && nextBatch.length > 1) {
                const lastSrc = currentLastSlide.getAttribute('data-original-src');
                if (nextBatch[0].videoSrc === lastSrc) {
                    nextBatch.push(nextBatch.shift());
                }
            }

            nextBatch.forEach((item, idx) => {
                const slideIndex = startIndex + idx;
                const loopedItem = {
                    ...item,
                    id: `${item.id}_rnd_${loopCounter}_${idx}`
                };
                const slide = createSlideElement(loopedItem, slideIndex);
                container.appendChild(slide);
                if (observer) observer.observe(slide);
            });

            setTimeout(() => {
                isLoopAppending = false;
            }, 150);
        }

        function setupInfiniteScroll() {
            const container = document.getElementById('shortsContainer');
            if (!container || container._hasInfiniteScroll) return;
            container._hasInfiniteScroll = true;

            container.addEventListener('scroll', () => {
                if (container.scrollTop + container.clientHeight >= container.scrollHeight - (container.clientHeight * 2.5)) {
                    appendInfiniteShortsLoop();
                }
            }, { passive: true });
        }

        // ── Auto-Play na Przewijaniu i Zmianie Slajdu ──
        function setupIntersectionObserver() {
            if (observer) observer.disconnect();

            const options = {
                root: document.getElementById('shortsContainer'),
                threshold: 0.6
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slide = entry.target;
                    const video = slide.querySelector('video');
                    const iframe = slide.querySelector('iframe');
                    const index = parseInt(slide.getAttribute('data-index') || '0', 10);

                    if (entry.isIntersecting) {
                        activeSlideIndex = index;
                        document.querySelectorAll('.short-slide').forEach(s => s.classList.remove('active'));
                        slide.classList.add('active');
                        const allSlides = document.querySelectorAll('.short-slide');
                        if (activeSlideIndex >= allSlides.length - 3) {
                            appendInfiniteShortsLoop();
                        }
                        updateProgress();
                        if (slide.id !== window._lastCaptionSlideId) {
                            window._lastCaptionSlideId = slide.id;
                            if (typeof window.resetCaptionsAutoHideOnSlideChange === 'function') {
                                window.resetCaptionsAutoHideOnSlideChange();
                            }
                        }

                        // WIRTUALNY REŻYSER DŹWIĘKU
                        if (window.AudioDirector) {
                            const mediaType = video ? 'video' : (iframe && iframe.classList.contains('live-channel-iframe') ? 'live_iframe' : (iframe ? 'youtube' : 'unknown'));
                            const mediaEl = video || iframe;
                            window.AudioDirector.acquireFocus(slide.id, mediaType, mediaEl);
                        } else {
                            if (video) {
                                video.muted = isGlobalMuted;
                                video.play().catch(() => {});
                            } else if (iframe && iframe.classList.contains('live-channel-iframe')) {
                                triggerLiveChannelAutoplay(iframe, true);
                            }
                        }

                        if (video) {
                            video.ontimeupdate = updateVideoProgress;
                            // Automatyczne przejście do kolejnej losowej rolki po zakończeniu filmu
                            video.onended = function() {
                                if (isAutoAdvanceEnabled) {
                                    showShortsToast('🎲 Kolejna rolka...');
                                    setTimeout(() => {
                                        scrollToSlide(activeSlideIndex + 1);
                                    }, 300);
                                } else {
                                    video.currentTime = 0;
                                    video.play().catch(() => {});
                                }
                            };
                        }
                    } else {
                        // Wyciszenie i uśpienie po opuszczeniu ekranu
                        if (window.AudioDirector) {
                            const isDistant = Math.abs(index - activeSlideIndex) > 1;
                            const mediaType = video ? 'video' : (iframe && iframe.classList.contains('live-channel-iframe') ? 'live_iframe' : (iframe ? 'youtube' : 'unknown'));
                            const mediaEl = video || iframe;
                            window.AudioDirector._silenceSource({
                                id: slide.id,
                                type: mediaType,
                                element: mediaEl,
                                originalSrc: slide.getAttribute('data-original-src')
                            }, { deepSleep: isDistant });
                        } else {
                            if (video) {
                                video.pause();
                                video.currentTime = 0;
                            }
                            if (iframe && iframe.classList.contains('live-channel-iframe')) {
                                triggerLiveChannelAutoplay(iframe, false);
                            }
                        }
                    }
                });
            }, options);

            document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
        }

        // ── Odbiór eventów z YouTube Player API (Auto-advance po zakończeniu wideo) ──
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            let data;
            try {
                data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            } catch (e) { return; }

            // YouTube state 0 = ENDED
            if (data && (data.event === 'onStateChange' && data.info === 0)) {
                if (isAutoAdvanceEnabled) {
                    showShortsToast('🎲 Kolejna rolka...');
                    setTimeout(() => {
                        scrollToSlide(activeSlideIndex + 1);
                    }, 400);
                }
            }
        });

        // ── Automatyczne ukrywanie dolnych napisów + wywołanie jednym przyciskiem na życzenie ──
        let captionsHideTimer = null;
        let isCaptionsPinned = false;
        const CAPTIONS_AUTO_HIDE_MS = 4000;

        function updateCaptionsToggleUI(isVisible) {
            const btn = document.getElementById('captionsToggleBtn');
            if (!btn) return;
            btn.setAttribute('aria-pressed', isVisible ? 'true' : 'false');
            btn.title = isVisible
                ? 'Ukryj dolne napisy'
                : 'Pokaż dolne napisy na życzenie';
        }

        function setCaptionsVisible(isVisible) {
            const shell = document.getElementById('shortsShell');
            if (!shell) return;
            if (isVisible) {
                shell.classList.remove('captions-hidden');
            } else {
                shell.classList.add('captions-hidden');
            }
            updateCaptionsToggleUI(isVisible);
        }

        function scheduleCaptionsAutoHide(delayMs = CAPTIONS_AUTO_HIDE_MS) {
            if (captionsHideTimer) {
                clearTimeout(captionsHideTimer);
                captionsHideTimer = null;
            }
            if (isCaptionsPinned) return;
            captionsHideTimer = setTimeout(() => {
                if (!isCaptionsPinned) {
                    setCaptionsVisible(false);
                }
            }, delayMs);
        }

        window._captionsPauseTimer = function() {
            if (captionsHideTimer) {
                clearTimeout(captionsHideTimer);
                captionsHideTimer = null;
            }
        };

        window._captionsResumeTimer = function() {
            if (!isCaptionsPinned) {
                scheduleCaptionsAutoHide(2500);
            }
        };

        window.resetCaptionsAutoHideOnSlideChange = function() {
            isCaptionsPinned = false;
            setCaptionsVisible(true);
            scheduleCaptionsAutoHide(CAPTIONS_AUTO_HIDE_MS);
        };

        window.toggleCaptionsOnDemand = function(e) {
            if (e) {
                e.stopPropagation();
            }
            const shell = document.getElementById('shortsShell');
            if (!shell) return;

            if (captionsHideTimer) {
                clearTimeout(captionsHideTimer);
                captionsHideTimer = null;
            }

            const isCurrentlyHidden = shell.classList.contains('captions-hidden');
            if (isCurrentlyHidden) {
                isCaptionsPinned = true;
                setCaptionsVisible(true);
            } else {
                isCaptionsPinned = false;
                setCaptionsVisible(false);
            }
        };

        // ── Pasek Poziomy (Header Actions Drawer) ──
        window.toggleHeaderActionsDrawer = function(e) {
            if (e) {
                e.stopPropagation();
            }
            const group = document.getElementById('headerMoreGroup');
            const btn = document.getElementById('headerMoreToggleBtn');
            const icon = document.getElementById('headerMoreIcon');
            if (!group) return;

            const isOpen = group.classList.toggle('drawer-open');
            if (btn) {
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }
            if (icon) {
                icon.className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-ellipsis';
            }
        };

        // ── Pasek Pionowy (Vertical Actions Drawer) ──
        window.toggleVerticalActionsDrawer = function(e) {
            if (e) {
                e.stopPropagation();
            }
            const shell = document.getElementById('shortsShell');
            if (!shell) return;
            const isOpen = shell.classList.toggle('vertical-actions-open');

            const moreBtns = document.querySelectorAll('.vertical-more-toggle-btn');
            const moreLabels = document.querySelectorAll('.vertical-more-label');

            moreBtns.forEach(btn => {
                btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                const icon = btn.querySelector('.vertical-more-icon');
                if (icon) {
                    icon.className = isOpen ? 'fa-solid fa-xmark vertical-more-icon' : 'fa-solid fa-ellipsis-vertical vertical-more-icon';
                }
            });

            moreLabels.forEach(lbl => {
                lbl.textContent = isOpen ? 'Zwiń' : 'Więcej';
            });
        };

        // Zamknięcie paska poziomego po kliknięciu poza niego
        document.addEventListener('click', function(e) {
            const headerGroup = document.getElementById('headerMoreGroup');
            if (headerGroup && headerGroup.classList.contains('drawer-open')) {
                if (!headerGroup.contains(e.target)) {
                    window.toggleHeaderActionsDrawer();
                }
            }
        });

        // ── Kliknięcie / Tap w rolkę ──
        window.handleSlideTap = function(slideEl) {
            if (!slideEl) return;

            // Jeśli pasek poziomy był rozwinięty, zwiń go przy tapnięciu w rolkę
            const headerGroup = document.getElementById('headerMoreGroup');
            if (headerGroup && headerGroup.classList.contains('drawer-open')) {
                window.toggleHeaderActionsDrawer();
                return;
            }

            const video = slideEl.querySelector('video');
            const iframe = slideEl.querySelector('iframe.live-channel-iframe');
            const ytIframe = slideEl.querySelector('iframe:not(.live-channel-iframe)');
            const indicator = slideEl.querySelector('.play-indicator-overlay');

            if (window.AudioDirector) {
                window.AudioDirector.unlockAudio();
            }

            if (iframe) {
                if (window.AudioDirector) {
                    window.AudioDirector.acquireFocus(slideEl.id, 'live_iframe', iframe);
                } else {
                    triggerLiveChannelAutoplay(iframe, true);
                }
                if (indicator) {
                    indicator.innerHTML = '<i class="fa-solid fa-play"></i>';
                    indicator.classList.add('show');
                    setTimeout(() => indicator.classList.remove('show'), 500);
                }
                return;
            }

            if (video) {
                if (video.paused) {
                    if (window.AudioDirector) {
                        window.AudioDirector.acquireFocus(slideEl.id, 'video', video);
                    } else {
                        video.play().catch(() => {});
                    }
                    if (indicator) {
                        indicator.innerHTML = '<i class="fa-solid fa-play"></i>';
                        indicator.classList.add('show');
                        setTimeout(() => indicator.classList.remove('show'), 500);
                    }
                } else {
                    if (window.AudioDirector) {
                        window.AudioDirector._silenceSource({ id: slideEl.id, type: 'video', element: video });
                    } else {
                        video.pause();
                    }
                    if (indicator) {
                        indicator.innerHTML = '<i class="fa-solid fa-pause"></i>';
                        indicator.classList.add('show');
                        setTimeout(() => indicator.classList.remove('show'), 500);
                    }
                }
            } else if (ytIframe) {
                if (slideEl._ytPaused) {
                    ytIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
                    slideEl._ytPaused = false;
                    if (window.AudioDirector) {
                        window.AudioDirector.acquireFocus(slideEl.id, 'youtube', ytIframe);
                    }
                    if (indicator) {
                        indicator.innerHTML = '<i class="fa-solid fa-play"></i>';
                        indicator.classList.add('show');
                        setTimeout(() => indicator.classList.remove('show'), 500);
                    }
                } else {
                    ytIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*');
                    slideEl._ytPaused = true;
                    if (indicator) {
                        indicator.innerHTML = '<i class="fa-solid fa-pause"></i>';
                        indicator.classList.add('show');
                        setTimeout(() => indicator.classList.remove('show'), 500);
                    }
                }
            }
        };

        // ── Wyciszenie Globalne ──
        window.toggleGlobalMute = function() {
            if (window.AudioDirector) {
                isGlobalMuted = window.AudioDirector.toggleMasterMute();
            } else {
                isGlobalMuted = !isGlobalMuted;
                const icon = document.getElementById('globalMuteIcon');
                if (icon) {
                    icon.className = isGlobalMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                    icon.style.color = isGlobalMuted ? '#fff' : '#facc15';
                }
                document.querySelectorAll('.short-slide video').forEach(v => {
                    v.muted = isGlobalMuted;
                });
                document.querySelectorAll('.short-slide iframe.live-channel-iframe').forEach(ifr => {
                    triggerLiveChannelAutoplay(ifr, !isGlobalMuted);
                });
            }
            showShortsToast(isGlobalMuted ? '🔇 Wyciszono dźwięk' : '🔊 Dźwięk włączony (DSP Master)');
        };

        // ── Nawigacja Strzałkami ──
        window.scrollToSlide = function(targetIndex) {
            const items = document.querySelectorAll('.short-slide');
            if (targetIndex >= items.length - 2) {
                appendInfiniteShortsLoop();
            }
            const updatedItems = document.querySelectorAll('.short-slide');
            const idx = Math.max(0, Math.min(updatedItems.length - 1, targetIndex));
            if (updatedItems[idx]) {
                updatedItems[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        function updateVideoProgress(e) {
            const video = e.target;
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            const bar = document.getElementById('shortsProgressFill');
            if (bar) bar.style.width = pct + '%';
        }

        function updateProgress() {
            const total = document.querySelectorAll('.short-slide').length || cleanShortsBase.length || 1;
            const pct = ((activeSlideIndex + 1) / total) * 100;
            const bar = document.getElementById('shortsProgressFill');
            if (bar) bar.style.width = pct + '%';
        }

        // ── Obsługa Klawiatury ──
        window.addEventListener('keydown', (e) => {
            const container = document.getElementById('shortsContainer');
            if (!container) return;

            const slideHeight = container.clientHeight;
            if (e.key === 'ArrowDown' || e.key === 'j') {
                e.preventDefault();
                const items = container.querySelectorAll('.short-slide');
                if (activeSlideIndex >= items.length - 2) {
                    appendInfiniteShortsLoop();
                }
                container.scrollBy({ top: slideHeight, behavior: 'smooth' });
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
                e.preventDefault();
                container.scrollBy({ top: -slideHeight, behavior: 'smooth' });
            } else if (e.key === 'm') {
                toggleGlobalMute();
            } else if (e.key === 'r' || e.key === 's') {
                // 'r' lub 's' = Random / Shuffle
                e.preventDefault();
                jumpToRandomReel();
            } else if (e.key === 'a') {
                // 'a' = Auto-advance toggle
                e.preventDefault();
                toggleAutoAdvance();
            } else if (e.key === ' ') {
                e.preventDefault();
                const activeSlide = document.querySelectorAll('.short-slide')[activeSlideIndex];
                if (activeSlide) handleSlideTap(activeSlide);
            }
        });

        // ── Ładowanie Danych Feedu ──
        let baseFeedLoaded = false;
        let cloudFeedLoaded = false;
        let rawSeedShorts = [];

        function mergeAndRenderShorts() {
            let combined = [];
            const seenIds = new Set();

            // 1. Najwyższy priorytet: Rolki opublikowane przez społeczność z chmury Firestore
            const cloudShorts = window._luminaCloudShorts || [];
            cloudShorts.forEach(cs => {
                if (cs && cs.id && !seenIds.has(cs.id)) {
                    seenIds.add(cs.id);
                    combined.push(cs);
                }
            });

            // 2. Lokalnie dodane rolki autora (localStorage)
            try {
                const storedCustom = JSON.parse(localStorage.getItem('lumina_custom_shorts') || '[]');
                if (Array.isArray(storedCustom)) {
                    storedCustom.forEach(ls => {
                        if (ls && ls.id && !seenIds.has(ls.id)) {
                            seenIds.add(ls.id);
                            combined.push(ls);
                        }
                    });
                }
            } catch(e) {}

            // 3. Oficjalne bazowe rolki i transmisje ze strumienia shorts_feed.json
            rawSeedShorts.forEach(ss => {
                if (ss && ss.id && !seenIds.has(ss.id)) {
                    seenIds.add(ss.id);
                    combined.push(ss);
                }
            });

            shortsData = combined;
            renderSlides(shortsData);
        }

        async function loadShortsFeed() {
            try {
                const res = await fetch('/data/shorts/shorts_feed.json', { cache: 'no-cache' });
                if (res.ok) {
                    rawSeedShorts = await res.json();
                } else {
                    rawSeedShorts = FALLBACK_SHORTS;
                }
            } catch (err) {
                rawSeedShorts = FALLBACK_SHORTS;
            }
            baseFeedLoaded = true;
            mergeAndRenderShorts();

            // Inicjalizacja nasłuchu na rolki publikowane w chmurze Firestore
            function initCloudSync() {
                if (window.LuminaDB && typeof window.LuminaDB.subscribeToCloudShorts === 'function') {
                    window.LuminaDB.subscribeToCloudShorts((cloudShorts) => {
                        console.log('[Rolki] Otrzymano rolki z chmury Firestore:', (cloudShorts || []).length);
                        window._luminaCloudShorts = cloudShorts;
                        mergeAndRenderShorts();
                    });
                } else {
                    setTimeout(initCloudSync, 200);
                }
            }
            initCloudSync();

            // Obsługa bezpośredniego otwarcia dodawania rolki (#publish lub ?action=publish)
            if (window.location.hash === '#publish' || window.location.search.includes('action=publish')) {
                setTimeout(() => {
                    openPublishModal();
                }, 350);
            } else if (window.location.hash) {
                const targetId = window.location.hash.substring(1);
                setTimeout(() => {
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
                }, 400);
            }
        }

        // Cloudflare może wykonać skrypt po DOMContentLoaded; zabezpieczenie eliminuje
        // cichy brak startu feedu, który pozostawiał ekran rolek całkowicie pusty.
        let shortsFeedBooted = false;
        function bootShortsFeed() {
            if (shortsFeedBooted) return;
            shortsFeedBooted = true;
            loadShortsFeed();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootShortsFeed, { once: true });
        } else {
            bootShortsFeed();
        }
    </script>
