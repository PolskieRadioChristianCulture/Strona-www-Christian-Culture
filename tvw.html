        :root {

        html[data-ml-mode="portrait"] .channel-frame,

            { from: '14:00', to: '16:00', ch: 'radio',      name: 'Radio CC Women' },
            { from: '16:00', to: '18:00', ch: 'nowoczesna', name: 'Nowoczesna muzyka chrześcijańska' },
            { from: '18:00', to: '19:00', ch: 'marriage',   name: 'CC Marriage — Małżeństwo z Misją' },
            { from: '19:00', to: '20:00', ch: 'rodzina',    name: 'Christian Culture Rodzina' },
            { from: '20:00', to: '21:00', ch: 'wybrane',    name: 'Women TV — wybrane' },
            { from: '21:00', to: '22:00', ch: 'modlitwa',   name: 'Biblijny Czas Modlitwy' },
            { from: '22:00', to: '24:00', ch: 'polska',     name: 'Polska muzyka chrześcijańska' }
        ];
        // Kanał zastępczy, gdy program skończy się wcześniej (sygnał *_FINISHED z kanału).
        const TVW_FALLBACK = 'babskie';

        // Okno pt (od zachodu) – sob (do zachodu): tylko dobór repertuaru, nigdy nie oznaczane publicznie.
        const CC_LAT = 52.23, CC_LON = 21.01;
        function ccSunsetMs(day) {
            const rad = Math.PI / 180, y = day.getFullYear(), m = day.getMonth(), d = day.getDate();
            const doy = Math.round((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 864e5), g = 2 * Math.PI / 365 * (doy - 1);
            const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
            const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
            const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(CC_LAT * rad) * Math.cos(decl)) - Math.tan(CC_LAT * rad) * Math.tan(decl)) / rad;
            return Date.UTC(y, m, d) + (720 - 4 * (CC_LON - ha) - eq) * 60000;
        }
        function ccIsRestWindow(now) {
            const day = now.getDay();
            if (day === 5) return now.getTime() >= ccSunsetMs(now);
            if (day === 6) return now.getTime() < ccSunsetMs(now);
            return false;
        }
        const CC_REST_SWAP = { nowoczesna: 'worship', babskie: 'worship' };

        const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
        let earlyFinished = {}, earlyDay = new Date().toDateString();

        function getScheduleState(now = new Date()) {
            const mins = now.getHours() * 60 + now.getMinutes();
            const slot = TVW_RAMOWKA.find(s => mins >= toMin(s.from) && mins < toMin(s.to)) || TVW_RAMOWKA[0];
            const key = slot.from + '_' + slot.ch;
            let ch = slot.ch;
            if (ccIsRestWindow(now) && CC_REST_SWAP[ch]) ch = CC_REST_SWAP[ch];
            if (earlyFinished[key] && now.toDateString() === earlyDay) ch = TVW_FALLBACK;
            return { blockKey: key, chKey: ch, slot, channel: TVW_CHANNELS[ch].url, meta: TVW_CHANNELS[ch] };
        }
        window.TVW = { ramowka: TVW_RAMOWKA, channels: TVW_CHANNELS, getScheduleState };

        // ── Silnik dwóch ramek (jak Master Live) ──
        const params = new URLSearchParams(location.search);
        const isEmbed = document.documentElement.classList.contains('tvw-embedded');
        let isMuted = params.get('muted') === '1' || (isEmbed && params.get('muted') !== '0');
        const frames = [document.getElementById('channel-frame-a'), document.getElementById('channel-frame-b')];
        let activeIdx = 0, currentUrl = null, currentKey = null, switching = false, switchStarted = 0, timers = [];
        const active = () => frames[activeIdx], inactive = () => frames[1 - activeIdx];
        const bumper = document.getElementById('tvwBumper'), bumperBar = document.getElementById('tvwBumperBar');

        function srcFor(url, muted) {
            const sep = url.includes('?') ? '&' : '?';
            return url + sep + (muted ? 'muted=1&autoplay=1' : 'autoplay=1') + '&in_mcr=1&noticker=1&safe_monetization=1&t=' + Date.now();
        }
        function post(frame, msg) { try { frame && frame.contentWindow && frame.contentWindow.postMessage(msg, '*'); } catch (e) {} }
        function silence(frame, pause) {
            if (!frame) return;
            post(frame, { type: 'MUTE_AUDIO' }); post(frame, 'MUTE_AUDIO'); post(frame, '{"event":"command","func":"mute","args":""}');
            if (pause) post(frame, '{"event":"command","func":"pauseVideo","args":""}');
        }
        function unmute(frame) {
            if (!frame) return;
            post(frame, { type: 'UNMUTE_AUDIO' }); post(frame, 'UNMUTE_AUDIO');
            post(frame, '{"event":"command","func":"unMute","args":""}'); post(frame, '{"event":"command","func":"playVideo","args":""}');
        }
        // Kanały mają własne paski — w TVW chowamy je, żeby był jeden, różowy pasek stacji.
        function suppressChannelChrome(frame) {
            try {
                const d = frame.contentDocument;
                if (!d || !d.documentElement) return;
                d.documentElement.classList.add('inside-iframe', 'no-ticker');
                if (d.body) d.body.classList.add('inside-iframe', 'no-ticker');
                if (!d.getElementById('tvw-suppressor')) {
                    const st = d.createElement('style');
                    st.id = 'tvw-suppressor';
                    st.textContent = `footer,.footer,.footer-ticker,.ticker-popup-tab,.bottom-ticker-bar,.tv24-ticker-system,.worship-live-ticker,.lumina-master-ticker,.ticker-wrap,.radio-ticker-wrap,.top-header-bar,.top-header,.header-bar,.channel-header-bar,#startOverlay,.start-overlay,#masterUnmuteBanner{display:none!important}
                        html.tvw-phone .reflection-canvas-card{display:none!important}`;
                    (d.head || d.documentElement).appendChild(st);
                }
                d.documentElement.classList.toggle('tvw-phone', mode === 'portrait' || mode === 'land');
            } catch (e) {}
        }

        function switchChannel(state, force) {
            if (currentUrl === state.channel && !force) return;
            timers.forEach(clearTimeout); timers = [];
            const first = currentUrl === null;
            currentUrl = state.channel;
            updateNowNext();
            if (first) {
                silence(inactive(), true); inactive().src = 'about:blank';
                active().src = srcFor(state.channel, isMuted);
                return;
            }
            switching = true; switchStarted = Date.now();
            document.getElementById('tvwBumperTitle').textContent = state.meta.title;
            document.getElementById('tvwBumperDesc').textContent = state.meta.desc;
            bumperBar.style.transition = 'none'; bumperBar.style.width = '0';
            bumper.classList.add('show');
            silence(active(), true); silence(inactive(), true);
            inactive().src = 'about:blank';
            timers.push(setTimeout(() => { inactive().src = srcFor(state.channel, true); }, 400));
            timers.push(setTimeout(() => { bumperBar.style.transition = 'width 6.5s linear'; bumperBar.style.width = '100%'; }, 50));
            timers.push(setTimeout(() => {
                const out = active(), inc = inactive();
                silence(out, true); out.src = 'about:blank';
                inc.classList.replace('inactive', 'active'); out.classList.replace('active', 'inactive');
                activeIdx = 1 - activeIdx;
                if (!isMuted) unmute(inc); else silence(inc, false);
                bumper.classList.remove('show');
                timers.push(setTimeout(() => { switching = false; }, 700));
            }, 7000));
        }

        function checkSchedule() {
            const today = new Date().toDateString();
            if (today !== earlyDay) { earlyDay = today; earlyFinished = {}; }
            if (switching) {
                if (Date.now() - switchStarted > 30000) { switching = false; bumper.classList.remove('show'); } else return;
            }
            const st = getScheduleState(new Date());
            if (currentKey === null) { currentKey = st.blockKey; switchChannel(st); }
            else if (currentKey !== st.blockKey) { currentKey = st.blockKey; switchChannel(st, true); }
            else if (currentUrl !== st.channel) switchChannel(st);
        }

        // ── Teraz / Za chwilę / zegar ──
        const hhmm = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        function updateNowNext() {
            const now = new Date(), cur = getScheduleState(now);
            const nowTitle = cur.slot.name;
            document.getElementById('tvwNowTitle').textContent = nowTitle;
            document.getElementById('tpNow').textContent = nowTitle;
            document.getElementById('tpNowDesc').textContent = cur.meta.desc;
            const base = new Date(now); base.setSeconds(0, 0);
            for (let i = 1; i <= 1440; i++) {
                const at = new Date(base.getTime() + i * 60000), st = getScheduleState(at);
                if (st.blockKey !== cur.blockKey) {
                    document.getElementById('tvwNextTime').textContent = hhmm(at);
                    document.getElementById('tvwNextTitle').textContent = st.slot.name;
                    break;
                }
            }
            const mins = now.getHours() * 60 + now.getMinutes();
            // Na telefonie: od pasma trwającego teraz do końca dnia.
            document.getElementById('tpList').innerHTML = TVW_RAMOWKA.filter(s => mins < toMin(s.to)).map(s => {
                const cls = mins >= toMin(s.from) ? 'now' : '';
                return '<div class="tp-row ' + cls + '"><span class="h">' + s.from + '</span><span class="n">' + s.name + '</span></div>';
            }).join('');
        }
        function tickClock() {
            const n = new Date();
            document.getElementById('tvwClock').textContent = hhmm(n);
            document.getElementById('tvwDate').textContent = n.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase();
        }

        // ── Pasek informacyjny (tylko prawdziwe adresy i informacje) ──
        const TVW_NEWS = [
            '<span class="badge">TVW</span> Telewizja Kobiet Christian Culture — na żywo 24/7 na <b>polskieradio.cc/TVW</b>',
            '<span class="badge">CC WOMEN</span> <a href="/ccwomen" target="_blank" rel="noopener">Poznaj CC Women — <b>polskieradio.cc/ccwomen</b></a>',
            '<span class="badge">YOUTUBE</span> Subskrybuj kanał <b>@CCWomen7</b> na YouTube',
            '<span class="badge">KĄCIKI</span> <a href="/Ewa/" target="_blank" rel="noopener">Kącik Ewangelizacyjny Ewy</a> <span class="heart">♥</span> <a href="/Zaneta/" target="_blank" rel="noopener">Kącik Żanety</a>',
            '<span class="badge">KURS</span> <a href="/akademia/kurscodzienny" target="_blank" rel="noopener">Kurs Codzienny: 10 minut ze Słowem — <b>polskieradio.cc/akademia</b></a>',
            '<span class="badge">WSPARCIE</span> <a href="/wspieraj" target="_blank" rel="noopener">Pomóż nam nieść Ewangelię dalej — <b>polskieradio.cc/wspieraj</b></a>',
            '<span class="badge">BIBLIA</span> <a href="/biblia-audio" target="_blank" rel="noopener">Biblia Audio: słuchaj w drodze — <b>polskieradio.cc/biblia-audio</b></a>'
        ];
        const items = TVW_NEWS.map(t => '<span class="it">' + t + ' <span class="heart" aria-hidden="true">♥</span></span>').join('');
        document.getElementById('tvwTrack').innerHTML = items + items;

        // ── Tryb ekranu: telefon pion / poziom / PC (jak Master Live PLUS) ──
        let mode = '';
        function layout() {
            const vv = window.visualViewport;
            const w = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
            if (!w || !h) return;
            const next = isEmbed ? 'desktop' : (h > w ? 'portrait' : (h <= 500 ? 'land' : 'desktop'));
            const r = document.documentElement.style;
            if (next === 'portrait') { const s = w / 1920; r.setProperty('--ml-s', s.toFixed(5)); r.setProperty('--ml-x', '0px'); r.setProperty('--ml-y', '0px'); r.setProperty('--ml-stage-h', Math.round(1080 * s) + 'px'); }
            if (next === 'land') { const s = Math.min(w / 1920, h / 1080); r.setProperty('--ml-s', s.toFixed(5)); r.setProperty('--ml-x', Math.round((w - 1920 * s) / 2) + 'px'); r.setProperty('--ml-y', Math.round((h - 1080 * s) / 2) + 'px'); }
            if (next !== mode) { mode = next; document.documentElement.setAttribute('data-ml-mode', mode); frames.forEach(suppressChannelChrome); }
        }

        // ── Dźwięk ──
        const unmuteBanner = document.getElementById('tvwUnmute');
        function hideBanner() { unmuteBanner.style.opacity = '0'; setTimeout(() => { unmuteBanner.style.display = 'none'; }, 500); }
        function userUnmute() {
            isMuted = false; hideBanner();
            document.getElementById('tpSound').hidden = true;
            if (!switching) unmute(active());
        }
        if (isEmbed) unmuteBanner.style.display = 'none';
        else {
            window.addEventListener('click', userUnmute);
            window.addEventListener('touchstart', userUnmute, { passive: true });
            if (!isMuted) {
                setTimeout(hideBanner, 5000);
                [800, 1600, 3200].forEach(t => setTimeout(() => { if (!switching) unmute(active()); }, t));
            }
        }
        unmuteBanner.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') userUnmute(); });
        document.getElementById('tpFull').addEventListener('click', (e) => {
            e.stopPropagation(); userUnmute();
            const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
            try { Promise.resolve(req && req.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {}); } catch (err) {}
        });

        frames.forEach(f => f.addEventListener('load', () => {
            suppressChannelChrome(f);
            if (isMuted || f !== active() || switching) silence(f, false);
            else [300, 1200, 3000].forEach(t => setTimeout(() => { if (!isMuted && f === active() && !switching) unmute(f); }, t));
        }));
        window.addEventListener('message', (ev) => {
            let type = '';
            const d = ev.data;
            if (typeof d === 'string') { try { const p = JSON.parse(d); type = p.type || p.event || ''; } catch (e) { type = d; } } else if (d && typeof d === 'object') type = d.type || '';
            if (type === 'YT_PLAYER_PLAYING' && !isMuted && !switching) unmute(active());
            if (/_FINISHED$/.test(type) && currentKey) { earlyFinished[currentKey] = true; checkSchedule(); }
            if (type === 'UNMUTE_AUDIO') userUnmute();
            if (type === 'MUTE_AUDIO') { isMuted = true; silence(active(), false); }
        });

        // Strażnik obrazu: pusta ramka przez 30 s → ponowne wczytanie kanału.
        let badTicks = 0;
        setInterval(() => {
            if (switching || !currentUrl) return;
            let bad = false;
            try { const d = active().contentDocument; bad = !d || !d.body || d.location.href === 'about:blank' || d.body.childElementCount === 0; } catch (e) { bad = true; }
            badTicks = bad ? badTicks + 1 : 0;
            if (badTicks >= 3) { badTicks = 0; active().src = srcFor(currentUrl, isMuted); }
        }, 10000);

        layout();
        window.addEventListener('resize', layout);
        window.addEventListener('orientationchange', () => { setTimeout(layout, 200); setTimeout(layout, 700); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
        tickClock(); setInterval(tickClock, 10000);
        setInterval(updateNowNext, 30000);
        setInterval(() => frames.forEach(suppressChannelChrome), 2000);
        setInterval(checkSchedule, 10000);
        checkSchedule();
    </script>
</body>
