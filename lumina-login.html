    <!-- Natychmiastowa weryfikacja sesji w nagłówku: zalogowani nie widzą tego okna -->
    <script>
        (function() {
            try {
                const uid = localStorage.getItem('lumina_user_uid');
                const slug = localStorage.getItem('lumina_current_user_slug');
                const prof = localStorage.getItem('lumina_current_user_profile') || localStorage.getItem('lumina_current_user');
                let isLogged = (uid && uid.length > 5) || (slug && slug !== 'guest' && slug !== 'gosc' && slug !== 'anonymous');
                if (!isLogged && prof) {
                    try {
                        const p = JSON.parse(prof);
                        if (p && (p.uid || (p.slug && p.slug !== 'guest' && p.slug !== 'gosc'))) isLogged = true;
                    } catch(e) {}
                }
                if (isLogged) {
                    const params = new URLSearchParams(window.location.search);
                    const r = params.get('next') || params.get('redirect') || params.get('to') || params.get('target');
                    let target = 'lumina';
                    if (r) {
                        if (r.includes('projektant')) target = '/projektant';
                        else if (r === 'tablica' || r.includes('tablica')) target = 'tablica';
                        else if (r === 'profil' || r.includes('profil')) target = 'profil';
                        else target = r;
                    }
                    window.location.replace(target);
                }
            } catch(e) {}
        })();
    </script>

    <!-- Integracja silnika Firebase Auth LUMINA -->
    <script type="module">
        import { loginWithGoogle, ensureDbReady, getCurrentUser, getCurrentProfile, onAuthChange } from './lumina-db.js?v=20261013_notifsafe1';

        const btn = document.getElementById('btnGoogleLogin');
        const textEl = document.getElementById('btnGoogleText');
        const iconSvg = document.getElementById('googleIconSvg');
        const statusEl = document.getElementById('statusMsg');

        window.addEventListener('lumina-auth-state', (e) => {
            if (e.detail && e.detail.user) {
                window.location.replace(getRedirectTarget());
            }
        });

        // Pobierz cel przekierowania z URL (np. ?redirect=tablica lub ?redirect=profil)
        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            const r = params.get('next') || params.get('redirect') || params.get('to') || params.get('target');
            if (r) {
                if (r.includes('projektant')) return '/projektant';
                if (r === 'tablica' || r.includes('tablica')) return 'tablica';
                if (r === 'profil' || r.includes('profil')) return 'profil';
                if (r.startsWith('http') || r.startsWith('/')) return r;
                return r;
            }
            return 'lumina';
        }

        // Błyskawiczne przekierowanie dla zalogowanych — okno nie pokazuje się zalogowanym
        async function checkAutoLogin() {
            try {
                const { auth } = await ensureDbReady();
                const curUser = getCurrentUser();
                if (curUser && curUser.uid) {
                    window.location.replace(getRedirectTarget());
                    return;
                }
                if (auth && auth.currentUser) {
                    window.location.replace(getRedirectTarget());
                    return;
                }
                if (typeof onAuthChange === 'function') {
                    onAuthChange((user) => {
                        if (user && user.uid) {
                            window.location.replace(getRedirectTarget());
                        }
                    });
                }
            } catch(e) {}

            // Użytkownik jest niezalogowany: płynnie odsłoń okno logowania
            const container = document.getElementById('loginContainer');
            if (container) {
                container.classList.add('ready');
            }
        }
        checkAutoLogin();

        window.handleDirectGoogleLogin = async function() {
            if (btn) btn.disabled = true;
            if (iconSvg) iconSvg.style.display = 'none';
            if (textEl) textEl.innerHTML = '<span class="spinner"></span> &nbsp; Logowanie...';
            if (statusEl) {
                statusEl.className = 'status-msg';
                statusEl.textContent = 'Trwa autoryzacja konta Google...';
            }

            try {
                const res = await loginWithGoogle();
                if (!res) {
                    if (btn) btn.disabled = false;
                    if (iconSvg) iconSvg.style.display = 'block';
                    if (textEl) textEl.textContent = 'Zaloguj się z Google';
                    if (statusEl) {
                        statusEl.className = 'status-msg';
                        statusEl.textContent = 'Wybierz konto Google, aby się zalogować.';
                    }
                    return;
                }
                if (res && res.isRedirecting) {
                    if (statusEl) statusEl.textContent = 'Przekierowywanie do Google...';
                    return;
                }

                if (statusEl) {
                    statusEl.className = 'status-msg success';
                    statusEl.textContent = '✨ Zalogowano pomyślnie! Witamy w LUMINA.';
                }

                setTimeout(() => {
                    window.location.href = getRedirectTarget();
                }, 400);

            } catch (err) {
                console.error('Google Auth Error:', err);
                if (btn) btn.disabled = false;
                if (iconSvg) iconSvg.style.display = 'block';
                if (textEl) textEl.textContent = 'Zaloguj się z Google';
                if (statusEl) {
                    statusEl.className = 'status-msg error';
                    if (err.code === 'auth/popup-closed-by-user') {
                        statusEl.textContent = 'Okno logowania zostało zamknięte. Spróbuj ponownie.';
                    } else if (err.code === 'auth/popup-blocked') {
                        statusEl.textContent = 'Twoja przeglądarka zablokowała okno logowania. Zezwól na wyskakujące okienka lub zaloguj się e-mailem poniżej.';
                    } else if (err.code === 'auth/network-request-failed') {
                        statusEl.textContent = 'Błąd połączenia. Sprawdź internet i spróbuj ponownie.';
                    } else {
                        statusEl.textContent = err.message || 'Nie udało się zalogować. Spróbuj ponownie.';
                    }
                }
            }
        };
    </script>
